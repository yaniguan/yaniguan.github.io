# Places I have been, rendered as small rotatable 3D models on /outside/.
# Newest first is not required: _includes/places.liquid sorts by date.
#
# One entry per visit:
#   name:     what the card says, e.g. "Griffith Observatory"
#   location: city / region / country shown under the name
#   date:     YYYY-MM-DD (the card shows "Mon YYYY")
#   model:    path to a .glb under assets/models/ (see bin/place-model.sh)
#   poster:   optional still image shown before the model loads
#   maps:     optional Google Maps search text; defaults to "name, location"
#   orbit:    optional starting angle in degrees (default 30), to turn the
#             model's best side to the camera
#   note:     optional one-liner
#   lat/lon:  optional decimal degrees; puts a pin on the road-trip map that
#             links back to this card
#
- name: Fishlake National Forest
  location: Utah
  date: 2026-09-26
  model: assets/models/fishlake-national-forest.glb
  orbit: 150
  # Approximate: Fish Lake itself, not the exact spot the photo was taken.
  lat: 38.55
  lon: -111.71

- name: Honolulu
  location: Oʻahu, Hawaiʻi
  date: 2024-10-01
  model: assets/models/honolulu-oahu.glb
  note: Diamond Head keeps watch so the beach can stay off duty.
  lat: 21.2620
  lon: -157.8055

- name: Big Island
  location: Hawaiʻi Island, Hawaiʻi
  date: 2025-09-01
  model: assets/models/big-island-kilauea.glb
  maps: Hawaiʻi Volcanoes National Park
  note: The only place where the ground is still under construction.
  lat: 19.4069
  lon: -155.2834

- name: Maui
  location: Hawaiʻi
  date: 2026-10-01
  model: assets/models/maui-haleakala.glb
  maps: Haleakalā National Park
  note: Haleakalā, where the clouds are the ones looking up.
  lat: 20.7097
  lon: -156.2533
