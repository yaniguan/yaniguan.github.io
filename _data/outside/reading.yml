# The reading shelf on /outside/: the thirty-six plays of the 1623 First Folio
# in the Folio's own order and its own three sections. Troilus and Cressida is
# missing from the Folio's catalogue but is printed at the head of the
# tragedies, which is where it sits here.
#
#   device:      the e-reader on the "Reading now" card
#   device_note: the line under it
#   now_reading: optional, the title currently open on it
#
# Per play (all optional, leave blank if unsure):
#   read: true   marks the spine as read (a key appears once any are)
#   note: one line shown when the spine is hovered or focused
#
device: Kindle Paperwhite
device_note: plain front-lit e-ink
now_reading:

sections:
