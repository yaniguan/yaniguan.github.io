  - 写长篇和跑马拉松一样，难在第三十公里。我的论文正好跑到那儿。
  unexpected_en:
  - "Pain is inevitable, suffering optional, he says. I opted for new running shoes and left them by the door."
  - "A novel, like a marathon, gets hard around kilometre thirty. That is where my thesis lives now."
