# Road trips on /outside/. The interactive map, the trip rows under it and the
# numbers in the stats strip are all built from this file.
#
# start: where every trip begins and ends -- name, lat, lon, optional note.
#
# trips: one entry per trip, oldest first.
#   year:       shown in the row's gutter and on the map's year chips
#   title:      "Los Angeles → Somewhere"
#   car:        shown after the title
#   color:      line colour on the map. Keep it mid-tone so it reads on both the
#               light and the dark map tiles (Esri Light / Dark Gray Canvas).
#   summary:    the paragraph under the title
#   stops:      the full itinerary, in order; rendered joined with " → "
#   route:      [lat, lon] waypoints for the map line, out and back to LA. Taken
#               from ROUTES in bin/roadtrip-map.py, which writes (lon, lat): flip
#               the pair when copying. Shape points, so not every one is a stop.
#   side_route: optional detour taken from mid-trip -- name plus its own route
#   markers:    named stops drawn on the map -- name, lat, lon, optional note.
#               endpoint: true marks the far end of the trip (drawn larger).
#
# The markers are the labelled points in bin/roadtrip-map.py (LABELS,
# WAYPOINTS, and the unlabelled Texas STOPS, named here from the 2024
# itinerary).

start:
  name: Los Angeles
  lat: 34.05
  lon: -118.24
  note: start and finish

trips:
  - year: 2023
    title: Los Angeles → Seattle
    car: Toyota RAV4
    color: "#2f7fc1"
    summary: >-
      Highway 1 and US-101 the whole way up, on the water for most of it — Big
      Sur, Monterey, San Francisco, the Oregon headlands, and a coast town west
      of Portland whose name I have lost. A few days in the national parks around
      Seattle, then home the other side of the mountains: Portland, the falls
      just east of it, and US-395 down through Reno and the eastern Sierra.
    stops:
      - Los Angeles
      - Monterey
      - San Francisco
      - a coast town west of Portland
      - Seattle
      - the national parks around it
      - Portland
      - the falls east of it
      - Reno
      - Los Angeles
    route:
      - [34.05, -118.24] # Los Angeles
      - [34.42, -119.70] # the coast road
      - [35.28, -120.66]
      - [36.27, -121.81]
