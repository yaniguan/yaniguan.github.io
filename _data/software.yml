# Software listed on /publications/.
#
# To add a project: append an item below. `group` must match one of the group ids
# in `groups`; `url`, `icon` and `stack` are optional (`icon` is a path under
# /assets/img/, shown inline before the name). Keep descriptions to what the code
# actually does today.

groups:
  - id: equivariant
    title: Equivariant ML for chemistry
  - id: systems
    title: Systems
  - id: tools
    title: Tools & experiments

items:
  - name: WignerFlow
    group: equivariant
    url: https://github.com/yaniguan/WignerFlow
    icon: /assets/img/WignerFlow-icon.svg
    tagline: Equivariant generative model that produces MD trajectories without an integrator
    description: >
      Given the last few frames, an E(3)-equivariant network (eSCN-style SO(2) convolutions
      with Wigner-D alignment, l_max = 2, causal attention over time) predicts the frame
      50 fs ahead with a flow-matching head. On Lennard-Jones argon (256 atoms), 4 of 5
      training seeds run 10⁴-step rollouts without crashing, and the best match OpenMM
      temperature, RDF, VACF and diffusion within v0 tolerances. Rollout speed is 25.8 ns/day on one A100.
    stack: Python · PyTorch · OpenMM · flow matching · A100 profiling

  - name: Ouroboros
    group: equivariant
    url: https://github.com/yaniguan/ouroboros-ocsr
    icon: /assets/img/ouroboros-ocsr-icon.svg
    tagline: Rotation-aware optical chemical structure recognition
    description: >
      Turns a molecule drawing into SMILES with stereochemistry, and compares a standard
      CNN, a rotation-augmented CNN and a C8 steerable (rotation-equivariant) encoder under
      one shared decoder and evaluation protocol. Best result on 298 real images: 54.0%
      exact match (ACS 40%, UOB 84%, USPTO 37.8%) with an A + C ensemble and beam 5.
      Includes an interactive rotation lab.
    stack: Python · PyTorch · escnn steerable CNNs · RDKit · Transformer decoder

  - name: YLM
    group: equivariant
    url: https://github.com/yaniguan/YLM
    icon: /assets/img/YLM-icon.svg
    tagline: Language tokens that read 3D vectors and tensors directly
    description: >
      An Irreps-to-Text cross-attention layer: text tokens attend to SE(3)-equivariant atom
      features with invariant weights, so a question such as "what is the force on this
      oxygen?" returns a vector that rotates exactly with the molecule (error ~2e-6).
      On the TensorQA-v0 benchmark (84,757 questions on 20k QM9 molecules) it reaches force
      cosine 0.96, versus 0.11 when the question text is removed.
    stack: Python · PyTorch · MatSciBERT / MiniLM · QM9

  - name: VERDICT
    group: systems
    tagline: Consensus optical chemical structure recognition, with a browser extension
    description: >
      Four independent recognizers — DECIMER, MolScribe, MolNexTR and a fine-tuned
      GLM-4.1V — vote by molecular identity (InChIKey), and the winner must still survive
      chemical parsing and an image round-trip. The answer is one canonical SMILES with a
      confidence tier, an explicit abstention path, and a per-engine audit trace. On ACS
      figures the quorum accepts 88.5% of crops at 86.2% precision.
    stack: Python · PyTorch · RDKit · HTTP service (per-engine workers) · Chrome extension

  - name: Molecule multimodal RAG
    group: systems
    tagline: Retrieval across text, figures, and multi-scale simulation
    description: >
      A molecular knowledge graph in which depictions and simulations are first-class
      retrieval modalities, not just text. Literature text and figures are harvested and
      passed through OCSR, so every record carries a structure keyed on its parent
      InChIKey plus the DOI, figure and engine votes behind it. Retrieval mixes semantic
      search, structure similarity, exact-InChIKey lookup and structural search over DFT
      and MD records — which is what joins a molecule in a paper to the formulations it
      appears in.
    stack: Python · RDKit · OPSIN · SQLite/FTS5 hybrid retrieval · graph expansion

  - name: ChatDFT
    group: systems
    url: https://github.com/yaniguan/ChatDFT
    tagline: LLM and HPC agentic platform for quantum-chemistry workflows
    description: >
      Turns a natural-language request into production DFT calculations: an agent chain
      parses intent, proposes reaction hypotheses with RAG, builds structures, prepares VASP
      inputs, submits batch jobs to PBS/Slurm and analyses the results (adsorption and free
      energies). Bayesian optimisation of DFT parameters needs 73% fewer evaluations than a
      grid search.
    stack: Python · LLM agents · RAG · ASE / pymatgen · VASP · PBS/Slurm · AWS EKS

  - name: ChemVisionAgent
    group: systems
    url: https://github.com/yaniguan/ChemVisionAgent
    tagline: Multimodal agent for reasoning over scientific images
    description: >
      A ReAct agent that answers questions about spectra, XRD patterns, microscopy and
      molecule images by calling composable vision skills, returning structured data with
      per-skill confidence and a low-confidence flag. Includes a capability-audit
      benchmark and LoRA fine-tuning for Qwen-VL.
    stack: Python · vision-language models (Claude, Qwen-VL) · FastAPI · Streamlit

  - name: hpc_monitor
    group: tools
    url: https://github.com/yaniguan/hpc_monitor
    tagline: Submit and monitor HPC jobs over SSH from one dashboard
    stack: Python · SSH · PBS/Slurm

  - name: bookmark_with_extensions
    group: tools
    url: https://github.com/yaniguan/bookmark_with_extensions
    tagline: Bookmark manager web app with a companion browser extension
    stack: TypeScript · Next.js · Supabase · Chrome extension

  - name: ChatBot
    group: tools
    url: https://github.com/yaniguan/ChatBot
    tagline: Modular MCP agent with an arXiv paper-fetching tool
    stack: Python · MCP · FastAPI
