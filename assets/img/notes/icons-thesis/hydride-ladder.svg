<text class="t s14 m k" x="75" y="50">13</text><text class="t s14 m k" x="151" y="50">14</text><text class="t s14 m k" x="227" y="50">15</text><text class="t s14 m k" x="303" y="50">16</text>
<text class="t s14 m k" x="26" y="89">4</text><text class="t s14 m k" x="26" y="151">5</text><text class="t s14 m k" x="26" y="213">6</text>

<rect class="lp ds" x="41.5" y="57.5" width="67" height="53" rx="10"/>
<rect class="lp ds" x="117.5" y="57.5" width="67" height="53" rx="10"/>
