<rect x="268" y="56" width="70" height="56" rx="10" fill="#e9e3f6"/><text class="t b s20 m" x="303" y="83">Se</text><text class="t s14 m" x="303" y="103">H₂Se</text>

<rect x="40" y="118" width="70" height="56" rx="10" fill="#e9e3f6"/><text class="t b s20 m" x="75" y="145">In</text><text class="t s14 m" x="75" y="165">InH₃</text>
<rect x="116" y="118" width="70" height="56" rx="10" fill="#e9e3f6"/><text class="t b s20 m" x="151" y="145">Sn</text><text class="t s14 m" x="151" y="165">SnH₄</text>
<rect x="192" y="118" width="70" height="56" rx="10" fill="#e9e3f6"/><text class="t b s20 m" x="227" y="145">Sb</text><text class="t s14 m" x="227" y="165">SbH₃</text>
<rect x="268" y="118" width="70" height="56" rx="10" fill="#e9e3f6"/><text class="t b s20 m" x="303" y="145">Te</text><text class="t s14 m" x="303" y="165">H₂Te</text>

<rect x="40" y="180" width="70" height="56" rx="10" fill="#f3dcc8"/><text class="t b s20 m" x="75" y="207">Tl</text><text class="t s14 m" x="75" y="227">TlH₃</text>
<rect x="116" y="180" width="70" height="56" rx="10" fill="#2d5bd7"/><text class="t b s20 m w" x="151" y="207">Pb</text><text class="t s14 m w" x="151" y="227">PbH₄</text>
