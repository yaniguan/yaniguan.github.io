<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="260" viewBox="0 0 720 260" role="img">
<title>Nine p-block hydrides placed on the periodic table, with amine yields at 1 ppm additive: Pb 60.8%, Tl 54.3%, Bi 36.9%, Bi at 6 ppm 59.7%, lighter elements about 1 to 3%</title>
<defs>
<style>.ln,.lc,.lb,.lp{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ln{stroke:#2b2350}.lc{stroke:#c96a2b}.lb{stroke:#2d5bd7}.lp{stroke:#d8cfee}.dt{stroke-dasharray:0.5 6.5}.ds{stroke-dasharray:6 6}.t{font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;fill:#2b2350}.b{font-weight:700}.i{font-style:italic;fill:#6d55b5}.w{fill:#fff}.m{text-anchor:middle}.e{text-anchor:end}.s14{font-size:14px}.s16{font-size:16px}.s18{font-size:18px}.s20{font-size:20px}.k{fill:#9a8fbf}</style>
</defs>
<rect x="4" y="4" width="712" height="252" rx="18" fill="#f6f2fb"/>
