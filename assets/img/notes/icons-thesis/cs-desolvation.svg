<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="260" viewBox="0 0 720 260" role="img">
<title>Cs+ with five, three, and one coordinating waters near bent CO2 on Ag: the Cs–O contact shortens from about 3.51 to 2.83 Å and ICOHP grows from −0.11 to −0.20 eV</title>
<defs>
<style>.ln,.lc,.lb,.lp{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ln{stroke:#2b2350}.lc{stroke:#c96a2b}.lb{stroke:#2d5bd7}.lp{stroke:#d8cfee}.dt{stroke-dasharray:0.5 6.5}.ds{stroke-dasharray:6 6}.t{font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;fill:#2b2350}.b{font-weight:700}.i{font-style:italic;fill:#6d55b5}.w{fill:#fff}.m{text-anchor:middle}.e{text-anchor:end}.s14{font-size:14px}.s16{font-size:16px}.s18{font-size:18px}.s20{font-size:20px}</style>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5L11 6L1 10.5Z" fill="#2b2350"/></marker>
<g id="ag"><circle r="11" fill="#cdc3ea"/><circle cx="-3.5" cy="-3.5" r="3.5" fill="#f6f2fb"/></g>
<g id="o"><circle r="8" fill="#2d5bd7"/><circle cx="-2.5" cy="-2.5" r="2.5" fill="#9fb6f0"/></g>
<g id="c"><circle r="8" fill="#2b2350"/><circle cx="-2.5" cy="-2.5" r="2.5" fill="#6d61a0"/></g>
<circle id="h" r="5" fill="#b4c5f5"/>
<g id="wa"><path class="ln" d="M10.4-13.4L0 0L10.4 13.4"/><use xlink:href="#o"/><use xlink:href="#h" x="10.4" y="-13.4"/><use xlink:href="#h" x="10.4" y="13.4"/></g>
<g id="cs"><circle r="20" fill="#8a77c4"/><circle r="16.5" fill="#5b4596"/><text class="t b w s14 m" y="5">Cs⁺</text></g>
<g id="low"><use xlink:href="#ag" x="-99"/><use xlink:href="#ag" x="-77"/><use xlink:href="#ag" x="-55"/><use xlink:href="#ag" x="-33"/><use xlink:href="#ag" x="-11"/><use xlink:href="#ag" x="11"/><use xlink:href="#ag" x="33"/><use xlink:href="#ag" x="55"/><use xlink:href="#ag" x="77"/><use xlink:href="#ag" x="99"/></g>
</defs>
<rect x="4" y="4" width="712" height="252" rx="18" fill="#f6f2fb"/>

<text class="t b s16 m" x="125" y="36">5 waters</text>
<text class="t m" x="125" y="60">Cs···O 3.51 Å</text>
<text class="t i s14 m" x="125" y="80">ICOHP −0.11 eV</text>
<use xlink:href="#low" x="125" y="236"/>
<path class="ln dt" d="M96 140L140 184M158 198V224"/>
<path class="ln" d="M140 184L158 190L176 184"/>
