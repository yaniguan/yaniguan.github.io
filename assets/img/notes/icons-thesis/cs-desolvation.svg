<use xlink:href="#wa" transform="translate(81.6 109.2) rotate(245)"/>
<use xlink:href="#wa" transform="translate(113 110.6) rotate(300)"/>
<use xlink:href="#wa" transform="translate(129.9 137) rotate(355)"/>
<use xlink:href="#cs" x="96" y="140"/>

<path class="ln" d="M222 120H258" marker-end="url(#ah)"/>

<text class="t b s16 m" x="360" y="36">3 waters</text>
<text class="t m" x="360" y="60">closer</text>
<text class="t i s14 m" x="360" y="80">ICOHP −0.18 eV</text>
