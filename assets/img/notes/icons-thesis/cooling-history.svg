<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="260" viewBox="0 0 720 260" role="img">
<title>Unprotected cooling leaves about 84 ppm Cu and 3.9% amine yield; cooling under cathodic hold leaves about 19 ppm and 30%; skipping cooling gives 51%</title>
<defs>
<style>.ln,.lc,.lb,.lp{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ln{stroke:#2b2350}.lc{stroke:#c96a2b}.lb{stroke:#2d5bd7}.lp{stroke:#d8cfee}.dt{stroke-dasharray:0.5 6.5}.ds{stroke-dasharray:6 6}.t{font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;fill:#2b2350}.b{font-weight:700}.i{font-style:italic;fill:#6d55b5}.w{fill:#fff}.m{text-anchor:middle}.e{text-anchor:end}.s14{font-size:14px}.s16{font-size:16px}.s18{font-size:18px}.s20{font-size:20px}</style>
<g id="cell">
<path d="M3 82H97V148Q97 161 84 161H16Q3 161 3 148Z" fill="#d6e0fa"/>
<path class="ln" d="M0 62V148Q0 164 16 164H84Q100 164 100 148V62"/>
<rect x="18" y="46" width="14" height="102" rx="3" fill="#c96a2b"/>
<rect x="21" y="50" width="4" height="94" rx="2" fill="#eab38a"/>
</g>
<circle id="ion" r="4" fill="#c96a2b"/>
</defs>
<rect x="4" y="4" width="712" height="252" rx="18" fill="#f6f2fb"/>
<path class="lp ds" d="M244 24V214M476 24V214"/>

<text class="t b s16 m" x="128" y="36">18 min cooling</text>
<use xlink:href="#cell" x="50" y="0"/>
<use xlink:href="#ion" x="96" y="100"/><use xlink:href="#ion" x="116" y="94"/><use xlink:href="#ion" x="136" y="104"/><use xlink:href="#ion" x="104" y="120"/><use xlink:href="#ion" x="126" y="126"/><use xlink:href="#ion" x="140" y="138"/><use xlink:href="#ion" x="94" y="142"/><use xlink:href="#ion" x="114" y="148"/><use xlink:href="#ion" x="132" y="152"/><use xlink:href="#ion" x="120" y="110"/>
<rect x="174" y="158.2" width="30" height="5.8" rx="2" fill="#2d5bd7"/>
<text class="t b s16 m" x="189" y="148">3.9%</text>
<text class="t m" x="100" y="188">≈84 ppm Cu</text>
<text class="t m" x="189" y="188">yield</text>

<text class="t b s16 m" x="360" y="36">cooling under cathodic hold</text>
<use xlink:href="#cell" x="282" y="0"/>
<use xlink:href="#ion" x="338" y="108"/><use xlink:href="#ion" x="362" y="128"/><use xlink:href="#ion" x="342" y="146"/>
<rect x="406" y="119" width="30" height="45" rx="3" fill="#2d5bd7"/><rect x="406" y="119" width="7" height="45" rx="3" fill="#5f82e3"/>
<text class="t b s16 m" x="421" y="109">30%</text>
<text class="t m" x="332" y="188">≈19 ppm Cu</text>
<text class="t m" x="421" y="188">yield</text>

<text class="t b s16 m" x="592" y="36">no cooling</text>
<use xlink:href="#cell" x="514" y="0"/>
<rect x="638" y="87.5" width="30" height="76.5" rx="3" fill="#2d5bd7"/><rect x="638" y="87.5" width="7" height="76.5" rx="3" fill="#5f82e3"/>
<text class="t b s16 m" x="653" y="77">51%</text>
<text class="t i m" x="564" y="188">no waiting</text>
<text class="t m" x="653" y="188">yield</text>

<text class="t i m" x="360" y="236">the waiting room is part of the experiment</text>
</svg>
