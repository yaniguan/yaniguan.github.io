<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="200" viewBox="0 0 240 200" role="img">
<title>H-down and O-down water on Cu</title>
<defs>
<style>.ln,.lc,.lb,.lp{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ln{stroke:#2b2350}.lc{stroke:#c96a2b}.lb{stroke:#2d5bd7}.lp{stroke:#d8cfee}.dt{stroke-dasharray:0.5 6.5}.ds{stroke-dasharray:6 6}.t{font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;fill:#2b2350}.b{font-weight:700}.i{font-style:italic;fill:#6d55b5}.w{fill:#fff}.m{text-anchor:middle}.e{text-anchor:end}.s14{font-size:14px}.s16{font-size:16px}.s18{font-size:18px}.s20{font-size:20px}</style>
<g id="cu"><circle r="11" fill="#c96a2b"/><circle cx="-3.5" cy="-3.5" r="3.5" fill="#eab38a"/></g>
<g id="O"><circle r="12" fill="#2d5bd7"/><circle cx="-4" cy="-4" r="3.5" fill="#9fb6f0"/></g>
<circle id="H" r="7" fill="#b4c5f5"/>
<g id="WD"><path class="ln" d="M-19 14.7L0 0L19 14.7"/><use xlink:href="#O"/><use xlink:href="#H" x="-19" y="14.7"/><use xlink:href="#H" x="19" y="14.7"/></g>
<g id="WU"><path class="ln" d="M-19-14.7L0 0L19-14.7"/><use xlink:href="#O"/><use xlink:href="#H" x="-19" y="-14.7"/><use xlink:href="#H" x="19" y="-14.7"/></g>
</defs>
<rect x="4" y="4" width="232" height="192" rx="18" fill="#f6f2fb"/>
<text class="t i m" x="120" y="36">same water, two moods</text>
<text class="t b m" x="72" y="72">H-down</text>
<text class="t b m" x="168" y="72">O-down</text>
<path class="lp" d="M120 86V140"/>
<use xlink:href="#WD" x="72" y="106"/>
<use xlink:href="#WU" x="168" y="124"/>
<g>
<use xlink:href="#cu" x="42" y="177"/><use xlink:href="#cu" x="64" y="177"/><use xlink:href="#cu" x="86" y="177"/><use xlink:href="#cu" x="108" y="177"/><use xlink:href="#cu" x="130" y="177"/><use xlink:href="#cu" x="152" y="177"/><use xlink:href="#cu" x="174" y="177"/><use xlink:href="#cu" x="196" y="177"/><use xlink:href="#cu" x="218" y="177"/>
<use xlink:href="#cu" x="31" y="158"/><use xlink:href="#cu" x="53" y="158"/><use xlink:href="#cu" x="75" y="158"/><use xlink:href="#cu" x="97" y="158"/><use xlink:href="#cu" x="119" y="158"/><use xlink:href="#cu" x="141" y="158"/><use xlink:href="#cu" x="163" y="158"/><use xlink:href="#cu" x="185" y="158"/><use xlink:href="#cu" x="207" y="158"/>
