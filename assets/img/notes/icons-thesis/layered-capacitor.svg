<g id="wu"><path class="ln" d="M-13.4-10.4L0 0L13.4-10.4"/><use xlink:href="#o"/><use xlink:href="#h" x="-13.4" y="-10.4"/><use xlink:href="#h" x="13.4" y="-10.4"/></g>
<g id="wl"><path class="ln" d="M-10.4-13.4L0 0L-10.4 13.4"/><use xlink:href="#o"/><use xlink:href="#h" x="-10.4" y="-13.4"/><use xlink:href="#h" x="-10.4" y="13.4"/></g>
<g id="wt1"><path class="ln" d="M16.85 2.29L0 0L-6.44 15.73"/><use xlink:href="#o"/><use xlink:href="#h" x="16.85" y="2.29"/><use xlink:href="#h" x="-6.44" y="15.73"/></g>
<g id="wt2"><path class="ln" d="M-14.38 9.07L0 0L-5.18-16.19"/><use xlink:href="#o"/><use xlink:href="#h" x="-14.38" y="9.07"/><use xlink:href="#h" x="-5.18" y="-16.19"/></g>
