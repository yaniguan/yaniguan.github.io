<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="260" viewBox="0 0 720 260" role="img">
<title>Calculated Cu capacitance falls from about 7.4 to 3.5 µF/cm² as explicit water layers go from one to four, all below the 13.35 continuum-only value</title>
<defs>
<style>.ln,.lc,.lb,.lp{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ln{stroke:#2b2350}.lc{stroke:#c96a2b}.lb{stroke:#2d5bd7}.lp{stroke:#d8cfee}.dt{stroke-dasharray:0.5 6.5}.ds{stroke-dasharray:6 6}.t{font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;fill:#2b2350}.b{font-weight:700}.i{font-style:italic;fill:#6d55b5}.w{fill:#fff}.m{text-anchor:middle}.e{text-anchor:end}.s14{font-size:14px}.s16{font-size:16px}.s18{font-size:18px}.s20{font-size:20px}</style>
<g id="so"><circle r="6" fill="#2d5bd7"/><circle cx="-2" cy="-2" r="2" fill="#9fb6f0"/></g>
<circle id="sh" r="3.5" fill="#b4c5f5"/>
<g id="sd"><path class="ln" d="M-9.5 7.3L0 0L9.5 7.3"/><use xlink:href="#so"/><use xlink:href="#sh" x="-9.5" y="7.3"/><use xlink:href="#sh" x="9.5" y="7.3"/></g>
<g id="su"><path class="ln" d="M-9.5-7.3L0 0L9.5-7.3"/><use xlink:href="#so"/><use xlink:href="#sh" x="-9.5" y="-7.3"/><use xlink:href="#sh" x="9.5" y="-7.3"/></g>
<g id="blk"><rect x="-18" y="0" width="36" height="8" rx="2" fill="#c96a2b"/><rect x="-15" y="2" width="12" height="3" rx="1.5" fill="#eab38a"/></g>
</defs>
<rect x="4" y="4" width="712" height="252" rx="18" fill="#f6f2fb"/>
<text class="t b s16" x="36" y="40">calculated C, µF cm⁻²</text>
<path class="lb ds" d="M60 60H690"/>
<text class="t e" x="690" y="50" style="fill:#2d5bd7">continuum only · 13.35</text>
<path class="ln" d="M60 196H690"/>

<rect x="92" y="120.6" width="56" height="75.4" rx="4" fill="#2d5bd7"/><rect x="92" y="120.6" width="11" height="75.4" rx="4" fill="#5f82e3"/>
<text class="t b s16 m" x="120" y="111">7.4</text>
<use xlink:href="#blk" x="174" y="188"/>
<use xlink:href="#sd" x="174" y="174"/>
<text class="t m" x="142" y="222">1 layer</text>

<rect x="252" y="143" width="56" height="53" rx="4" fill="#2d5bd7"/><rect x="252" y="143" width="11" height="53" rx="4" fill="#5f82e3"/>
<text class="t b s16 m" x="280" y="133">5.2</text>
<use xlink:href="#blk" x="334" y="188"/>
<use xlink:href="#sd" x="334" y="174"/><use xlink:href="#su" x="334" y="160"/>
<text class="t m" x="302" y="222">2 layers</text>

<rect x="412" y="154.2" width="56" height="41.8" rx="4" fill="#2d5bd7"/><rect x="412" y="154.2" width="11" height="41.8" rx="4" fill="#5f82e3"/>
<text class="t b s16 m" x="440" y="144">4.1</text>
<use xlink:href="#blk" x="494" y="188"/>
<use xlink:href="#sd" x="494" y="174"/><use xlink:href="#su" x="494" y="160"/><use xlink:href="#sd" x="494" y="134"/>
<text class="t m" x="462" y="222">3 layers</text>

<rect x="572" y="160.3" width="56" height="35.7" rx="4" fill="#2d5bd7"/><rect x="572" y="160.3" width="11" height="35.7" rx="4" fill="#5f82e3"/>
<text class="t b s16 m" x="600" y="150">3.5</text>
<use xlink:href="#blk" x="654" y="188"/>
<use xlink:href="#sd" x="654" y="174"/><use xlink:href="#su" x="654" y="160"/><use xlink:href="#sd" x="654" y="134"/><use xlink:href="#su" x="654" y="120"/>
<text class="t m" x="622" y="222">4 layers</text>

<text class="t i m" x="360" y="246">frozen nuclei: the electrons respond, the molecules can’t turn to help</text>
</svg>
