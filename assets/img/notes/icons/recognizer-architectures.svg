<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
<title>Five molecular image recognizer architectures</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#23395b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.n,.a{fill:none;stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.a{marker-end:url(#h)}.p,.w,.o,.c,.s{stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.p{fill:#dceef5}.w{fill:#fff}.o{fill:#1fa3a3}.c{fill:#e07a5f}.s{fill:#8fa98a}.t{font-family:Helvetica,Arial,sans-serif;fill:#23395b;font-size:16px;text-anchor:middle}.b{font-weight:700}</style>
<rect width="720" height="320" fill="#fff"/>
<text class="t b" x="360" y="31" style="font-size:22px">Recognizer architectures</text><rect class="w" x="16" y="48" width="688" height="44" rx="9"/><text class="t b" x="94" y="76" style="font-size:18px">VLM</text><text class="t" x="435" y="76" style="font-size:16px">ViT → projector → LLM</text><path class="n" d="M174 56V84" /><rect class="w" x="16" y="100" width="688" height="44" rx="9"/><text class="t b" x="94" y="128" style="font-size:18px">DECIMER</text><text class="t" x="435" y="128" style="font-size:16px">CNN → Transformer</text><path class="n" d="M174 108V136" /><rect class="w" x="16" y="152" width="688" height="44" rx="9"/><text class="t b" x="94" y="180" style="font-size:18px">MolScribe</text><text class="t" x="435" y="180" style="font-size:16px">ViT → atoms/bonds → graph</text><path class="n" d="M174 160V188" /><rect class="w" x="16" y="204" width="688" height="44" rx="9"/><text class="t b" x="94" y="232" style="font-size:18px">MolNexTR</text><text class="t" x="435" y="232" style="font-size:16px">ConvNeXt + ViT → graph</text><path class="n" d="M174 212V240" /><rect class="p" x="16" y="256" width="688" height="44" rx="9"/><text class="t b" x="94" y="284" style="font-size:18px">Mine</text><text class="t" x="435" y="284" style="font-size:16px">steerable CNN + equivariant tokens → SMILES</text><path class="n" d="M174 264V292" />
</svg>
