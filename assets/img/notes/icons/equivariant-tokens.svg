<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
<title>Equivariant tokens: every grid position carries a compass of eight directions; a 12×12 grid times 8 directions gives 1,152 tokens</title>
<style>.t{font-family:Helvetica,Arial,sans-serif;fill:#23395b;font-size:22px;text-anchor:middle}.b{font-weight:700}</style>
<defs><path id="ecp" d="M-7 0H7M0 -7V7M-5 -5L5 5M-5 5L5 -5" stroke="#9fb3c8" stroke-width="1.4" stroke-linecap="round"/></defs>
<rect width="240" height="200" fill="#fff"/>
<rect x="90" y="40" width="30" height="30" fill="#dceef5"/>
<path d="M90 10V130M120 10V130M150 10V130M60 40H180M60 70H180M60 100H180" stroke="#23395b" stroke-width="1.4" opacity=".55"/>
<rect x="60" y="10" width="120" height="120" rx="8" fill="none" stroke="#23395b" stroke-width="2.5"/>
<use href="#ecp" x="75" y="25"/><use href="#ecp" x="105" y="25"/><use href="#ecp" x="135" y="25"/><use href="#ecp" x="165" y="25"/>
<use href="#ecp" x="75" y="55"/><use href="#ecp" x="105" y="55"/><use href="#ecp" x="135" y="55"/><use href="#ecp" x="165" y="55"/>
<use href="#ecp" x="75" y="85"/><use href="#ecp" x="105" y="85"/><use href="#ecp" x="135" y="85"/><use href="#ecp" x="165" y="85"/>
<use href="#ecp" x="75" y="115"/><use href="#ecp" x="105" y="115"/><use href="#ecp" x="135" y="115"/><use href="#ecp" x="165" y="115"/>
<path d="M75 25l10 0M105 25l7.1 7.1M135 25l0 10M165 25l-7.1 7.1M75 55l0 10M105 55l-7.1 7.1M135 55l-10 0M165 55l-7.1 -7.1M75 85l-10 0M105 85l-7.1 -7.1M135 85l0 -10M165 85l7.1 -7.1M75 115l0 -10M105 115l7.1 -7.1M135 115l10 0M165 115l7.1 7.1" stroke="#1fa3a3" stroke-width="2.6" stroke-linecap="round"/>
<g fill="#23395b"><circle cx="75" cy="25" r="2"/><circle cx="105" cy="25" r="2"/><circle cx="135" cy="25" r="2"/><circle cx="165" cy="25" r="2"/><circle cx="75" cy="55" r="2"/><circle cx="105" cy="55" r="2"/><circle cx="135" cy="55" r="2"/><circle cx="165" cy="55" r="2"/><circle cx="75" cy="85" r="2"/><circle cx="105" cy="85" r="2"/><circle cx="135" cy="85" r="2"/><circle cx="165" cy="85" r="2"/><circle cx="75" cy="115" r="2"/><circle cx="105" cy="115" r="2"/><circle cx="135" cy="115" r="2"/><circle cx="165" cy="115" r="2"/></g>
<text class="t" x="120" y="160">12×12 × 8 = 1,152</text>
<text class="t b" x="120" y="188">position × direction</text>
</svg>
