<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
<title>Aging world model: design, current state and condition go in, the next state comes out and is fed back, step by step, into an aging curve whose crossing at 80 percent capacity gives the lifetime</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#23395b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hc" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#1fa3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.w{fill:#fff;stroke:#23395b;stroke-width:2.5;stroke-linejoin:round}.g{fill:none;stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#h)}.t{font-family:Helvetica,Arial,sans-serif;fill:#23395b;font-size:13px}.b{font-weight:700;font-size:14px}.s{font-size:13px}.u{fill:#1fa3a3}.m{text-anchor:middle}.wt{fill:#fff}.cr{fill:#e07a5f}.sm{font-size:13px}</style>
<rect width="720" height="280" fill="#fff"/>
<g transform="translate(14 30)"><rect class="w" width="150" height="52" rx="12"/><rect x="14" y="12" width="18" height="28" rx="3" fill="#fff" stroke="#23395b" stroke-width="2"/><rect x="18" y="26" width="10" height="10" rx="1.5" fill="#8fa98a"/><text class="t b" x="42" y="24">design</text><text class="t s u" x="42" y="40">how it's built</text></g>
<g transform="translate(14 112)"><rect width="150" height="52" rx="12" fill="#dceef5" stroke="#1fa3a3" stroke-width="2.8"/><path d="M14 38L22 28L30 32L38 16" fill="none" stroke="#1fa3a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text class="t b" x="46" y="24">state</text><text class="t s" x="46" y="40">V, Q, T, health</text></g>
<g transform="translate(14 194)"><rect class="w" width="150" height="52" rx="12"/><rect x="18" y="12" width="8" height="22" rx="4" fill="#fff" stroke="#23395b" stroke-width="2"/><circle cx="22" cy="38" r="6" fill="#e07a5f" stroke="#23395b" stroke-width="2"/><text class="t b" x="42" y="24">condition</text><text class="t s u" x="42" y="40">protocol, T, C-rate</text></g>
<path class="a" d="M168 56Q186 56 190 116M168 138H188M168 220Q186 220 190 160"/>
<rect x="196" y="92" width="122" height="92" rx="16" fill="#1fa3a3" stroke="#23395b" stroke-width="2.5"/>
<circle cx="236" cy="122" r="6" fill="#fff"/><circle cx="257" cy="114" r="6" fill="#fff"/><circle cx="278" cy="122" r="6" fill="#fff"/><path d="M242 122L251 116M263 116L272 122" stroke="#fff" stroke-width="2"/>
<text class="t b m wt" x="257" y="150">world</text><text class="t b m wt" x="257" y="168">model</text>
<path class="a" d="M322 138H346"/>
<rect x="352" y="112" width="96" height="52" rx="12" fill="#dceef5" stroke="#1fa3a3" stroke-width="2.8"/>
<text class="t b m" x="400" y="134">next state</text><text class="t s m" x="400" y="151">t + 1</text>
<path d="M400 168V214Q400 226 388 226H269Q257 226 257 214V190" fill="none" stroke="#1fa3a3" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#hc)"/>
<text class="t s m u" x="328" y="248">each prediction becomes the next input</text>
<path class="a" d="M452 138H480"/>
<text class="t b" x="460" y="126">…</text>
<rect class="w" x="486" y="24" width="222" height="200" rx="16"/>
<path class="g" d="M514 44V186H692" stroke-width="2"/>
<path d="M514 136H690" stroke="#e07a5f" stroke-width="2" stroke-dasharray="5 4"/>
<text class="t s cr" x="520" y="130">80% of initial</text>
<path d="M516 54C560 60 600 70 628 92C646 108 656 128 668 160" fill="none" stroke="#23395b" stroke-width="2.6" stroke-linecap="round"/>
<g fill="#1fa3a3" stroke="#23395b" stroke-width="1.4"><circle cx="530" cy="56" r="3.5"/><circle cx="556" cy="60" r="3.5"/><circle cx="582" cy="67" r="3.5"/><circle cx="606" cy="77" r="3.5"/><circle cx="628" cy="92" r="3.5"/><circle cx="646" cy="110" r="3.5"/></g>
<circle cx="657" cy="136" r="6" fill="#e07a5f" stroke="#23395b" stroke-width="2"/>
<path d="M657 142V186" stroke="#e07a5f" stroke-width="1.8" stroke-dasharray="3 3"/>
<text class="t s m" x="604" y="200">cycles / time →</text>
<text class="t b m sm" x="597" y="216">aging curve → lifetime</text>
</svg>
