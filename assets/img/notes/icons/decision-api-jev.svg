<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
<title>Decision API: the reasoning agent LLM sends repetitive judgment and scoring calls through a decision API to Jev, which returns typed outputs (Choice, Score, yes/no probability) that are checked before the agent uses them</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#23395b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hc" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#1fa3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.w{fill:#fff;stroke:#23395b;stroke-width:2.5;stroke-linejoin:round}.p{fill:#dceef5;stroke:#23395b;stroke-width:2;stroke-linejoin:round}.g{fill:none;stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#h)}.ac{fill:none;stroke:#1fa3a3;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#hc)}.t{font-family:Helvetica,Arial,sans-serif;fill:#23395b;font-size:13px}.b{font-weight:700;font-size:14px}.s{font-size:11px}.u{fill:#1fa3a3}.m{text-anchor:middle}.wt{fill:#fff}</style>
<rect width="720" height="260" fill="#fff"/>
<rect class="w" x="14" y="44" width="170" height="160" rx="16"/>
<rect x="72" y="62" width="54" height="46" rx="10" fill="#1fa3a3" stroke="#23395b" stroke-width="2.2"/>
<circle cx="88" cy="82" r="4" fill="#fff"/><circle cx="110" cy="82" r="4" fill="#fff"/><path d="M90 96q9 5 18 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<path d="M99 62v-8" stroke="#23395b" stroke-width="2.2" stroke-linecap="round"/><circle cx="99" cy="52" r="3" fill="#e07a5f"/>
<g fill="#dceef5" stroke="#23395b" stroke-width="1.6"><circle cx="140" cy="62" r="4"/><circle cx="150" cy="52" r="6"/></g>
<text class="t b m" x="99" y="134">reasoning</text><text class="t b m" x="99" y="151">agent LLM</text>
<text class="t s m u" x="99" y="172">plans, reasons,</text><text class="t s m u" x="99" y="186">calls tools</text>
<path class="a" d="M190 100H280"/>
<text class="t s m" x="235" y="90">typed question</text>
<path class="ac" d="M280 150H190"/>
<circle cx="235" cy="150" r="12" fill="#8fa98a" stroke="#23395b" stroke-width="2"/>
<path d="M229 150l4 4l8 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t s m" x="235" y="178">checked</text>
<rect x="286" y="68" width="144" height="112" rx="16" fill="#dceef5" stroke="#23395b" stroke-width="2.5"/>
<path class="g" d="M340 84q-6 0 -6 6v4q0 4 -4 4q4 0 4 4v4q0 6 6 6M376 84q6 0 6 6v4q0 4 4 4q-4 0 -4 4v4q0 6 -6 6" stroke-width="2.2"/>
<circle cx="358" cy="102" r="4" fill="#1fa3a3"/>
<text class="t b m" x="358" y="138">decision API</text>
<text class="t s m" x="358" y="155">repetitive judgment</text><text class="t s m" x="358" y="169">&amp; scoring calls</text>
<path class="a" d="M436 100H498"/>
<text class="t s m" x="467" y="90">question</text>
<path class="ac" d="M498 150H436"/>
<text class="t s m" x="467" y="170">typed</text><text class="t s m" x="467" y="184">output</text>
<rect class="w" x="504" y="18" width="202" height="208" rx="16"/>
<text class="t b" x="522" y="44" style="font-size:16px">Jev</text><text class="t s u" x="556" y="44">decision model</text>
<g transform="translate(516 58)">
<rect class="w" width="178" height="48" rx="10" stroke-width="2"/>
<g stroke="#23395b" stroke-width="1.4"><rect x="12" y="10" width="24" height="7" rx="2" fill="#fff"/><rect x="12" y="20" width="24" height="7" rx="2" fill="#1fa3a3"/><rect x="12" y="30" width="24" height="7" rx="2" fill="#fff"/></g>
<text class="t b" x="48" y="21" style="font-size:13px">Choice</text><text class="t s u" x="48" y="37">≤255 options + probs</text></g>
<g transform="translate(516 114)">
<rect class="w" width="178" height="48" rx="10" stroke-width="2"/>
<path class="g" d="M12 30H36" stroke-width="2"/><path d="M12 26v8M18 27v6M24 27v6M30 27v6M36 26v8" stroke="#23395b" stroke-width="1.6" stroke-linecap="round"/>
<path d="M24 14l4 6h-8z" fill="#e07a5f" stroke="#23395b" stroke-width="1.4" stroke-linejoin="round"/>
<text class="t b" x="48" y="21" style="font-size:13px">Score</text><text class="t s u" x="48" y="37">level on your rubric</text></g>
<g transform="translate(516 170)">
<rect class="w" width="178" height="48" rx="10" stroke-width="2"/>
<rect x="10" y="17" width="30" height="14" rx="7" fill="#dceef5" stroke="#23395b" stroke-width="1.6"/><rect x="10" y="17" width="20" height="14" rx="7" fill="#8fa98a" stroke="#23395b" stroke-width="1.6"/>
<text class="t b" x="48" y="21" style="font-size:13px">yes / no</text><text class="t s u" x="48" y="37">as a probability</text></g>
<text class="t s m" x="360" y="248">typed outputs can't come back malformed, but they can still be wrong, so they get checked</text>
</svg>
