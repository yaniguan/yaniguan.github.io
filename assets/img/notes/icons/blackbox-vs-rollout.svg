<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
<title>Black box versus rollout: on the left a black box turns inputs into one lifetime number; on the right a model rolls out a full aging curve state by state, with a knee and an endpoint at 80 percent</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#23395b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.w{fill:#fff;stroke:#23395b;stroke-width:2.5;stroke-linejoin:round}.g{fill:none;stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#23395b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#h)}.st{fill:#dceef5;stroke:#1fa3a3;stroke-width:2.4}.t{font-family:Helvetica,Arial,sans-serif;fill:#23395b;font-size:13px}.b{font-weight:700;font-size:14px}.s{font-size:13px}.u{fill:#1fa3a3}.m{text-anchor:middle}.wt{fill:#fff}.cr{fill:#e07a5f}.q{font-size:38px;font-weight:700}.n{font-size:18px}</style>
<rect width="720" height="280" fill="#fff"/>
<text class="t b m" x="140" y="30">before: black box</text>
<g stroke="#23395b" stroke-width="1.6"><rect x="16" y="86" width="44" height="18" rx="5" fill="#dceef5"/><rect x="16" y="112" width="44" height="18" rx="5" fill="#8fa98a"/><rect x="16" y="138" width="44" height="18" rx="5" fill="#fff"/></g>
<text class="t s m" x="38" y="176">inputs</text>
<path class="a" d="M66 121H92"/>
<rect x="98" y="72" width="100" height="98" rx="12" fill="#23395b" stroke="#23395b" stroke-width="2.5"/>
<text class="t m wt q" x="148" y="134">?</text>
<path class="a" d="M202 121H226"/>
<rect x="232" y="96" width="62" height="50" rx="10" fill="#fdf1ec" stroke="#e07a5f" stroke-width="2.5"/>
<text class="t b m cr n" x="263" y="128">N</text>
<text class="t s m" x="263" y="164">lifetime</text>
<text class="t s m" x="152" y="214">one number, no story:</text>
<text class="t s m" x="152" y="230">nothing to check along the way</text>
<path d="M316 24V256" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
<text class="t b m" x="518" y="30">now: learn the evolution</text>
<g class="t s m">
<rect class="st" x="338" y="46" width="52" height="34" rx="9"/><text x="364" y="67">s₀</text>
<rect class="st" x="414" y="46" width="52" height="34" rx="9"/><text x="440" y="67">s₁</text>
<rect class="st" x="490" y="46" width="52" height="34" rx="9"/><text x="516" y="67">s₂</text>
<rect class="st" x="566" y="46" width="52" height="34" rx="9"/><text x="592" y="67">…</text>
<rect x="642" y="46" width="60" height="34" rx="9" fill="#fdf1ec" stroke="#e07a5f" stroke-width="2.4"/><text x="672" y="67">sₙ</text></g>
<path class="a" d="M392 63H410M468 63H486M544 63H562M620 63H638"/>
<path class="g" d="M346 98V236H704" stroke-width="2"/>
<path d="M348 196H702" stroke="#e07a5f" stroke-width="2" stroke-dasharray="5 4"/>
<text class="t s cr" x="352" y="190">80%</text>
<path d="M350 106C420 112 500 124 560 142C600 156 630 176 652 204" fill="none" stroke="#23395b" stroke-width="2.6" stroke-linecap="round"/>
<g fill="#1fa3a3" stroke="#23395b" stroke-width="1.4"><circle cx="364" cy="107" r="3.5"/><circle cx="440" cy="115" r="3.5"/><circle cx="516" cy="129" r="3.5"/><circle cx="592" cy="154" r="3.5"/></g>
<g stroke="#1fa3a3" stroke-width="1.4" stroke-dasharray="2 3"><path d="M364 82V103M440 82V111M516 82V125M592 82V150M672 82L646 188"/></g>
<text class="t s" x="604" y="138">knee</text>
<circle cx="645" cy="196" r="6" fill="#e07a5f" stroke="#23395b" stroke-width="2"/>
<text class="t s m" x="645" y="222">end of life</text>
<text class="t s m" x="526" y="254">the whole aging curve, step by step, checkable at every state</text>
</svg>
