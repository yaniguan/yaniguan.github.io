<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
<title>World-model rollout: each predicted state feeds the next as input, and drift from the reference grows</title>
<style>.w{fill:#fff;stroke:#23395b;stroke-width:2.5;stroke-linejoin:round}.p{fill:#dceef5;stroke:#23395b;stroke-width:2.5;stroke-linejoin:round}.t{font-family:Helvetica,Arial,sans-serif;fill:#23395b;font-size:22px;text-anchor:middle}.b{font-weight:700}.c{font-size:24px}</style>
<defs><marker id="wn" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#23395b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="240" height="200" fill="#fff"/>
<rect class="w" x="14" y="28" width="52" height="38" rx="10"/>
<rect class="p" x="94" y="28" width="52" height="38" rx="10"/>
<rect class="p" x="174" y="28" width="52" height="38" rx="10" stroke-dasharray="5 3"/>
<g class="t b"><text x="40" y="55">t</text><text x="120" y="55">t+1</text><text x="200" y="55">t+2</text></g>
<g fill="none" stroke="#23395b" stroke-width="2.5" stroke-linecap="round"><path d="M68 47H90" marker-end="url(#wn)"/><path d="M148 47H170" marker-end="url(#wn)"/></g>
<text class="t" x="79" y="20">predict</text><text class="t" x="161" y="20">predict</text>
<path d="M120 69C120 82 200 82 200 71" fill="none" stroke="#1fa3a3" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" marker-end="url(#wn)"/>
<text class="t" x="224" y="104" style="fill:#e07a5f;text-anchor:end">drift grows</text>
<path d="M28 142L212 112L212 142Z" fill="#e07a5f" opacity=".15"/>
<path d="M20 106V154H224" fill="none" stroke="#23395b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 142C80 138 140 142 212 139" fill="none" stroke="#23395b" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>
<path d="M28 142C80 138 150 130 212 116" fill="none" stroke="#e07a5f" stroke-width="2.6" stroke-linecap="round"/>
<path d="M216 120V134" fill="none" stroke="#e07a5f" stroke-width="2" stroke-linecap="round" marker-start="url(#wn)" marker-end="url(#wn)"/>
<text class="t" x="62" y="128" style="fill:#e07a5f">rollout</text>
<path d="M24 170H52" stroke="#23395b" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/><text class="t" x="60" y="177" style="text-anchor:start">reference</text>
<text class="t b" x="120" y="197">world-model rollout</text>
</svg>
