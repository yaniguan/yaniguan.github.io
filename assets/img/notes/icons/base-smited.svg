<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
<title>SMI-TED: SMILES tokens encoded to a vector and reconstructed</title>
<style>.w{fill:#fff;stroke:#23395b;stroke-width:2.2;stroke-linejoin:round}.p{fill:#dceef5;stroke:#23395b;stroke-width:2.2;stroke-linejoin:round}.t{font-family:Helvetica,Arial,sans-serif;fill:#23395b;font-size:13px;text-anchor:middle}.b{font-weight:700}.s{font-size:10.5px}.c{font-size:15px}.l{text-anchor:start}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#23395b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="240" height="200" fill="#fff"/>
<g><rect class="w" x="32" y="18" width="26" height="24" rx="6"/><rect class="w" x="62" y="18" width="26" height="24" rx="6"/><rect class="w" x="92" y="18" width="26" height="24" rx="6"/><rect class="w" x="122" y="18" width="26" height="24" rx="6"/><rect class="w" x="152" y="18" width="26" height="24" rx="6"/><rect class="w" x="182" y="18" width="26" height="24" rx="6"/></g>
<g class="t b"><text x="45" y="35">C</text><text x="75" y="35" fill="#1fa3a3">1</text><text x="105" y="35">C</text><text x="135" y="35" fill="#e07a5f">O</text><text x="165" y="35">C</text><text x="195" y="35">(</text></g>
<path d="M120 48V60" fill="none" stroke="#23395b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#mn)"/>
<rect x="64" y="66" width="112" height="20" rx="5" fill="#fff" stroke="#23395b" stroke-width="2.5"/>
<g fill="#1fa3a3"><rect x="67" y="69" width="11" height="14" rx="2"/><rect x="81" y="69" width="11" height="14" rx="2" opacity=".5"/><rect x="95" y="69" width="11" height="14" rx="2" opacity=".8"/><rect x="109" y="69" width="11" height="14" rx="2" opacity=".35"/><rect x="123" y="69" width="11" height="14" rx="2"/><rect x="137" y="69" width="11" height="14" rx="2" opacity=".6"/><rect x="151" y="69" width="11" height="14" rx="2" opacity=".3"/><rect x="165" y="69" width="8" height="14" rx="2" opacity=".9"/></g>
<text class="t s l" x="184" y="80">vector</text>
